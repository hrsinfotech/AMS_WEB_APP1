services:
  postgres:
    image: postgres:16-alpine
    container_name: hrs-ams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrs_tech
      POSTGRES_USER: hrs
      POSTGRES_PASSWORD: hrs
    ports:
      - "5435:5432"
    volumes:
      - hrs_ams_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrs -d hrs_tech"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend-java
      dockerfile: Dockerfile.api
    container_name: hrs-ams-api
    restart: unless-stopped
    environment:
      PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hrs_tech
      SPRING_DATASOURCE_USERNAME: hrs
      SPRING_DATASOURCE_PASSWORD: hrs
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hrs_ams_postgres_data: